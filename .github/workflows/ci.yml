name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Verify Invariants, and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Zero Em Dash Typography Invariant
        run: |
          python3 tools/lint_no_em_dash.py

      - name: Compile Elevon Library and Binary
        run: |
          make clean
          make

      - name: Execute Full Test Suite
        run: |
          make test

      - name: Run Latency and Throughput Benchmarks
        run: |
          make bench

      - name: Verify CLI Simulation
        run: |
          ./bin/elevon sim
          ./bin/elevon afdx
          ./bin/elevon drill
